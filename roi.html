<script>
let currentUser = null;
let calendarDate = new Date();
let calendarRecords = {};

const db = window.brjSupabase || window.supabaseClient;

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2600);
}

function money(value) {
    return Number(value || 0).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function formatDate(value) {
    if (!value) return "--";

    return new Date(value).toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function renderCalendar() {
    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    document.getElementById("calendarMonth").textContent =
        calendarDate.toLocaleDateString("en-IN", {
            month: "long",
            year: "numeric"
        });

    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(day => {
        const element = document.createElement("div");
        element.className = "calendar-day";
        element.textContent = day;
        grid.appendChild(element);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "calendar-date empty-date";
        grid.appendChild(empty);
    }

    for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement("div");
        cell.className = "calendar-date";
        cell.textContent = day;

        const key = year + "-" +
            String(month + 1).padStart(2, "0") + "-" +
            String(day).padStart(2, "0");

        if (calendarRecords[key] === "credited") {
            cell.style.background = "#17452f";
            cell.style.borderColor = "#28513c";
            cell.style.color = "#72e4a9";
        }

        if (calendarRecords[key] === "pending") {
            cell.style.background = "#49391c";
            cell.style.borderColor = "#76602f";
            cell.style.color = "#ffe29a";
        }

        grid.appendChild(cell);
    }
}

function changeMonth(value) {
    calendarDate.setMonth(calendarDate.getMonth() + value);
    renderCalendar();
}

function showEmpty(id, tableId, show) {
    document.getElementById(id).style.display = show ? "none" : "block";
    document.getElementById(tableId).style.display = show ? "block" : "none";
}

function setText(id, value) {
    document.getElementById(id).textContent = value;
}

async function loadROI() {
    if (!db) {
        showToast("Database connection unavailable.");
        return;
    }

    try {
        const { data: sessionData, error: sessionError } =
            await db.auth.getSession();

        if (sessionError || !sessionData.session) {
            location.href = "index.html";
            return;
        }

        currentUser = sessionData.session.user;

        await loadMemberships();
        await loadROISettings();

        renderCalendar();

    } catch (error) {
        console.error("ROI loading error:", error);
        showToast("Unable to load ROI account.");
    }
}

/* MEMBER INVESTMENT DATA */

let memberPackages = [];

async function loadMemberships() {
    const { data, error } = await db
        .from("member_package_purchases")
        .select(`
            id,
            member_id,
            package_name,
            purchase_amount,
            purchase_status,
            activated_at,
            expires_at,
            completed_at
        `)
        .eq("user_id", currentUser.id)
        .order("activated_at", { ascending: false });

    if (error) {
        console.error("Membership error:", error);
        throw error;
    }

    memberPackages = data || [];

    const now = new Date();

    let totalInvestment = 0;
    let activeInvestment = 0;
    let completedInvestment = 0;

    const activePackages = [];

    memberPackages.forEach(item => {
        const amount = Number(item.purchase_amount || 0);

        totalInvestment += amount;

        const expired = item.expires_at &&
            new Date(item.expires_at) < now;

        const isActive =
            item.purchase_status === "ACTIVE" && !expired;

        if (isActive) {
            activeInvestment += amount;
            activePackages.push(item);
        } else {
            completedInvestment += amount;
        }
    });

    setText("totalInvestment", "₹" + money(totalInvestment));
    setText("activeInvestment", "₹" + money(activeInvestment));
    setText("completedInvestment", "₹" + money(completedInvestment));

    // Actual verified ROI ledger is not connected yet.
    setText("totalROI", money(0));
    setText("pendingROI", "₹" + money(0));

    renderInvestmentHistory();

    if (activePackages.length > 0) {
        renderActivePackage(activePackages[0]);
    } else {
        document.getElementById("packageCard").style.display = "none";
        document.getElementById("noPackage").style.display = "block";
    }
}

/* ACTIVE PACKAGE */

function renderActivePackage(item) {
    document.getElementById("noPackage").style.display = "none";
    document.getElementById("packageCard").style.display = "block";

    setText("packageName", item.package_name || "Membership");
    setText("packageStatus", item.purchase_status || "ACTIVE");
    setText("packageAmount", "₹" + money(item.purchase_amount));
    setText("packageStart", formatDate(item.activated_at));
    setText("packageEnd", formatDate(item.expires_at));

    setText("packageEarned", "₹" + money(0));

    let duration = "--";

    if (item.activated_at && item.expires_at) {
        const start = new Date(item.activated_at);
        const end = new Date(item.expires_at);

        duration = Math.max(
            0,
            Math.round((end - start) / (1000 * 60 * 60 * 24))
        ) + " Days";
    }

    setText("packageDuration", duration);
}

/* INVESTMENT HISTORY */

function renderInvestmentHistory() {
    const tbody = document.getElementById("investmentRecords");
    tbody.innerHTML = "";

    if (!memberPackages.length) {
        showEmpty("investmentEmpty", "investmentTable", false);
        return;
    }

    showEmpty("investmentEmpty", "investmentTable", true);

    memberPackages.forEach(item => {
        const tr = document.createElement("tr");

        [
            item.package_name || "--",
            "₹" + money(item.purchase_amount),
            formatDate(item.activated_at),
            item.purchase_status || "--"
        ].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });
}

/* ROI SETTINGS */

async function loadROISettings() {
    const { data, error } = await db
        .from("brj_roi_settings")
        .select(`
            daily_rate,
            duration_days,
            is_active,
            brj_packages!brj_roi_settings_package_id_fkey (
                package_name,
                package_price,
                duration_days
            )
        `);

    if (error) {
        console.error("ROI settings error:", error);
        throw error;
    }

    console.log("ROI settings loaded:", data || []);

    // Rates are displayed in console for verification.
    // No earnings are calculated or fabricated from settings.
}

/* DAILY HISTORY */

function showNoDailyRecords() {
    showEmpty("dailyEmpty", "dailyTable", false);
    document.getElementById("dailyRecords").innerHTML = "";
}

/* ROI TRANSACTIONS */

function showNoTransactions() {
    showEmpty("transactionEmpty", "transactionTable", false);
    document.getElementById("transactionRecords").innerHTML = "";
}

/* START */

showNoDailyRecords();
showNoTransactions();
loadROI();
</script>
