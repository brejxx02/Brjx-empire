<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080a10">
<title>BRJ EMPIRE | Admin Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

:root{
    --bg:#080a10;
    --card:#111722;
    --gold:#e6bb58;
    --light:#ffe29a;
    --text:#f4f5f7;
    --muted:#8792a4;
    --border:#242e3c;
    --green:#56d59b;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    color:var(--text);
    background:
    radial-gradient(ellipse at 50% 5%,rgba(230,187,88,.13),transparent 38%),
    radial-gradient(ellipse at 0% 100%,rgba(36,55,85,.16),transparent 40%),
    #080a10;
}

.wrapper{
    width:100%;
    max-width:440px;
}

/* BRAND */

.brand{
    text-align:center;
    margin-bottom:32px;
}

.brand-mark{
    width:76px;
    height:76px;
    margin:0 auto 17px;
    border-radius:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:linear-gradient(145deg,#f8dfa0,#c18d32 55%,#8e641f);
    box-shadow:0 12px 35px rgba(230,187,88,.2);
    border:1px solid rgba(255,226,154,.65);
}

.brand-mark:before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:18px;
}

.brand-mark span{
    font-size:30px;
    font-weight:950;
    letter-spacing:-3px;
    color:#17120a;
    transform:translateX(-1px);
}

.brand-name{
    font-size:34px;
    font-weight:950;
    letter-spacing:2px;
    color:#fff;
}

.brand-name span{
    color:var(--gold);
}

.brand-subtitle{
    margin-top:8px;
    font-size:10px;
    letter-spacing:4px;
    color:var(--muted);
    text-transform:uppercase;
}

/* LOGIN CARD */

.login-card{
    position:relative;
    overflow:hidden;
    padding:32px 26px 28px;
    border-radius:24px;
    border:1px solid rgba(230,187,88,.19);
    background:linear-gradient(145deg,rgba(20,28,41,.98),rgba(11,16,25,.98));
    box-shadow:
    0 30px 90px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.login-card:before{
    content:"";
    position:absolute;
    top:0;
    left:10%;
    width:80%;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.top-label{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:23px;
}

.top-label span{
    color:var(--gold);
    font-size:10px;
    font-weight:800;
    letter-spacing:2.5px;
}

.top-label i{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 9px var(--green);
}

.heading{
    text-align:center;
    font-size:27px;
    font-weight:850;
    letter-spacing:-.5px;
}

.description{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:9px;
    margin-bottom:31px;
}

/* INPUTS */

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:10px;
    color:#d8deea;
    font-size:13px;
    font-weight:650;
}

.input-box{
    position:relative;
}

.input-box input{
    width:100%;
    height:56px;
    padding:0 65px 0 17px;
    border:1px solid var(--border);
    border-radius:13px;
    background:#0a1019;
    outline:none;
    color:var(--text);
    font-size:14px;
    transition:.25s;
}

.input-box input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(230,187,88,.08);
}

.input-box input::placeholder{
    color:#657184;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:0;
    color:var(--gold);
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
    cursor:pointer;
}

/* REMEMBER */

.remember-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:3px 0 25px;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
}

.remember-row input{
    width:16px;
    height:16px;
    accent-color:var(--gold);
}

/* BUTTON */

.login-button{
    width:100%;
    height:57px;
    border:0;
    border-radius:14px;
    background:linear-gradient(110deg,#b98a32,#ffe29a,#d5a743);
    color:#17120a;
    font-size:14px;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 9px 30px rgba(230,187,88,.16);
    transition:.25s;
}

.login-button:hover{
    transform:translateY(-2px);
    box-shadow:0 13px 35px rgba(230,187,88,.25);
}

.login-button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

/* MESSAGE */

#message{
    display:none;
    padding:13px;
    margin-top:17px;
    border-radius:11px;
    font-size:13px;
    text-align:center;
    line-height:1.5;
}

/* SECURITY */

.security{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    margin-top:25px;
    color:var(--muted);
    font-size:11px;
}

.security-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px rgba(86,213,155,.65);
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#657184;
    font-size:11px;
    letter-spacing:.3px;
}

@media(max-width:380px){
    .login-card{padding:28px 19px;}
    .brand-name{font-size:29px;}
}
</style>

</head>

<body>

<div class="wrapper">

```
<div class="brand">

    <div class="brand-mark">
        <span>BRJ</span>
    </div>

    <div class="brand-name">
        BRJ <span>EMPIRE</span>
    </div>

    <div class="brand-subtitle">
        PREMIUM ADMINISTRATION
    </div>

</div>

<div class="login-card">

    <div class="top-label">
        <i></i>
        <span>AUTHORIZED ACCESS ONLY</span>
    </div>

    <h1 class="heading">Welcome Back</h1>

    <p class="description">
        Sign in to manage your BRJ EMPIRE platform.
    </p>

    <form id="adminLoginForm">

        <div class="input-group">
            <label for="adminEmail">Admin Email Address</label>

            <div class="input-box">
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >
            </div>
        </div>

        <div class="input-group">
            <label for="adminPassword">Password</label>

            <div class="input-box">
                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                >SHOW</button>
            </div>
        </div>

        <label class="remember-row">
            <input type="checkbox" id="rememberEmail">
            Remember my email
        </label>

        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >
            SECURE ADMIN LOGIN →
        </button>

        <div id="message"></div>

    </form>

    <div class="security">
        <span class="security-dot"></span>
        Protected Admin Authentication
    </div>

</div>

<div class="footer">
    © 2026 BRJ EMPIRE · ALL RIGHTS RESERVED
</div>
```

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="admin-auth.js"></script>

<script>
(function(){

    const password = document.getElementById("adminPassword");
    const toggle = document.getElementById("togglePassword");
    const email = document.getElementById("adminEmail");
    const remember = document.getElementById("rememberEmail");

    toggle.addEventListener("click",function(){

        if(password.type === "password"){
            password.type = "text";
            toggle.textContent = "HIDE";
        }else{
            password.type = "password";
            toggle.textContent = "SHOW";
        }

    });

    const savedEmail = localStorage.getItem("brj_admin_email");

    if(savedEmail){
        email.value = savedEmail;
        remember.checked = true;
    }

    remember.addEventListener("change",function(){

        if(this.checked){
            localStorage.setItem("brj_admin_email",email.value.trim());
        }else{
            localStorage.removeItem("brj_admin_email");
        }

    });

    email.addEventListener("input",function(){

        if(remember.checked){
            localStorage.setItem("brj_admin_email",email.value.trim());
        }

    });

})();
</script>

</body>
</html>
